name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN plus the scopes deploy-pages needs to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages publish in flight at a time; never cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: xcode-27
    # Every job in this repository is bounded, so a hang fails the job instead of sitting for the
    # six-hour default. The ceiling is meant to be that job's slowest green run on `main` under its
    # current definition, rounded up to the next five minutes and then tripled. `Scripts/verify.sh`
    # holds the rule that every job has one.
    # The first green run took 1m58s; round up to the next five minutes and triple it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Show Xcode version
        run: xcodebuild -version

      # Compile once, then document only this package's public products. Global docbuild flags
      # also reach dependency catalogs, whose external links are outside this site's scope.
      - name: Build public modules
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme swift-nps-Package \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -derivedDataPath .derivedData \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

      # Every Models archive is complete before its SDK resolves links against it.
      - name: Build product documentation
        run: |
          set -euo pipefail
          products="$PWD/.derivedData/Build/Products/Debug-iphonesimulator"
          sdkpath="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          architecture="$(uname -m)"
          mkdir -p .docc-cache .docc-deps .docc-symbols
          for product in SwiftNPSDataModels SwiftNPSData SwiftNPSLandmarksModels SwiftNPSLandmarks SwiftNPSSpeciesModels SwiftNPSSpecies SwiftNPSTaxonomyModels SwiftNPSTaxonomy SwiftNPSUnitsModels SwiftNPSUnits SwiftNPSVisitationModels SwiftNPSVisitation; do
            symbols="$PWD/.docc-symbols/$product"
            mkdir -p "$symbols"
            xcrun swift-symbolgraph-extract \
              -module-name "$product" \
              -target "$architecture-apple-ios26.0-simulator" \
              -sdk "$sdkpath" \
              -I "$products" -I "$products/PackageFrameworks" \
              -module-cache-path "$PWD/.docc-cache" \
              -minimum-access-level public -output-dir "$symbols"
            dependency=()
            case "$product" in
              *Models) ;;
              *) dependency=(--dependency "$PWD/.docc-deps/${product}Models.doccarchive") ;;
            esac
            xcrun docc convert "Sources/$product/$product.docc" \
              --fallback-display-name "$product" \
              --fallback-bundle-identifier "dev.cooperlabs.$product" \
              --additional-symbol-graph-dir "$symbols" \
              --output-path ".docc-deps/$product.doccarchive" \
              --enable-experimental-external-link-support --warnings-as-errors \
              ${dependency[@]+"${dependency[@]}"}
            test -s ".docc-deps/$product.doccarchive/linkable-entities.json"
          done

      # A merged landing page lists every public product; test support stays private.
      - name: Merge archives
        run: |
          set -euo pipefail
          "$(xcrun --find docc)" merge \
            .docc-deps/SwiftNPSDataModels.doccarchive .docc-deps/SwiftNPSData.doccarchive \
            .docc-deps/SwiftNPSLandmarksModels.doccarchive .docc-deps/SwiftNPSLandmarks.doccarchive \
            .docc-deps/SwiftNPSSpeciesModels.doccarchive .docc-deps/SwiftNPSSpecies.doccarchive \
            .docc-deps/SwiftNPSTaxonomyModels.doccarchive .docc-deps/SwiftNPSTaxonomy.doccarchive \
            .docc-deps/SwiftNPSUnitsModels.doccarchive .docc-deps/SwiftNPSUnits.doccarchive \
            .docc-deps/SwiftNPSVisitationModels.doccarchive .docc-deps/SwiftNPSVisitation.doccarchive \
            --synthesized-landing-page-name swift-nps \
            --synthesized-landing-page-kind Package \
            --output-path .merged.doccarchive

      # Rewrite the archive for static hosting under the Pages sub-path
      # (site serves from https://<owner>.github.io/swift-nps/).
      - name: Transform for static hosting
        run: |
          set -euo pipefail
          "$(xcrun --find docc)" process-archive transform-for-static-hosting \
            .merged.doccarchive \
            --output-path _site \
            --hosting-base-path swift-nps

      # DocC's static-hosting output has no landing page at the site root: the bare index.html is an
      # app shell that keeps baseUrl "/" (so its assets 404 under the Pages sub-path) and has no route
      # to render. Replace it with a redirect into the merged landing route so the bare URL works.
      - name: Write root redirect
        run: |
          set -euo pipefail
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=documentation/">
              <link rel="canonical" href="https://kalebcooper.github.io/swift-nps/documentation/">
              <title>swift-nps</title>
            </head>
            <body>
              <p>Redirecting to the <a href="documentation/">swift-nps documentation</a>…</p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Only main publishes. A workflow_dispatch on any other ref builds and stops, so an experiment
    # cannot overwrite the live site.
    if: github.ref == 'refs/heads/main'
    # The first green run took 10s; round up to the next five minutes and triple it.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
